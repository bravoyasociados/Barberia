<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
--bg:#000;
--card:#1a1a1a;
--text:#fff;
}
@media (prefers-color-scheme: light){
:root{--bg:#f5f5f5;--card:#fff;--text:#000;}
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
.container{padding:15px}
.hidden{display:none}

/* HEADER */
.header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:15px}
.logo-mini{position:absolute;left:0}
.logo-mini img{width:50px;height:50px;border-radius:50%}
.titulo{font-size:18px;font-weight:bold}

/* MENU */
.menu{display:flex;justify-content:space-around;margin-bottom:20px}
.menu-item{text-align:center}
.icono{width:70px;height:70px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}

/* SECCIONES */
.seccion{display:none}
.seccion.activa{display:block}

.card{background:var(--card);padding:10px;margin-top:10px;border-radius:8px}

/* SERVICIOS */
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.servicio{border-radius:50%;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ccc;font-size:12px}
.servicio.activo{border:2px solid #00c853}

/* PRODUCTOS */
.producto{border:2px solid #ccc;padding:10px;border-radius:8px;margin-top:8px}
.controls{display:flex;justify-content:space-between}

button{width:100%;padding:10px;margin-top:8px;background:#00c853;border:none}
input,select{width:100%;padding:10px;margin-top:5px}

/* LOGOUT */
.logout-btn{position:fixed;bottom:20px;right:20px;width:70px;height:70px;border-radius:50%;background:red;display:flex;justify-content:center;align-items:center;font-size:28px}
</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="header">
<div class="logo-mini"><img src="icono-192.png"></div>
<div class="titulo">King’s Barber</div>
</div>

<div class="menu">
<div onclick="mostrarSeccion('ventas')"><div class="icono">💰</div></div>
<div class="admin" onclick="mostrarSeccion('servicios')"><div class="icono">✂️</div></div>
<div class="admin" onclick="mostrarSeccion('productos')"><div class="icono">📦</div></div>
<div class="admin" onclick="mostrarSeccion('usuarios')"><div class="icono">👑</div></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card">
<input id="cliente" placeholder="Cliente">
<div id="listaServicios" class="servicios-grid"></div>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar</button>
</div>

<!-- SERVICIOS -->
<div id="servicios" class="seccion card">
<input id="nombreServicio" placeholder="Servicio">
<input id="precioServicio" type="number" placeholder="Precio">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion card">
<input id="nombreProd" placeholder="Producto">
<input id="precioProd" type="number">
<input id="stockProd" type="number">
<button onclick="crearProducto()">Agregar</button>
<div id="adminProductos"></div>
</div>

<!-- USUARIOS -->
<div id="usuarios" class="seccion card">
<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Password">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<button onclick="crearUsuario()">Crear</button>
<div id="listaUsuarios"></div>
</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"barberia-pro-3ca72.firebaseapp.com",
projectId:"barberia-pro-3ca72"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={};

// LOGIN
async function login(){
let snap=await db.collection("usuarios")
.where("usuario","==",user.value)
.where("password","==",pass.value)
.get();

if(snap.empty){alert("Error");return;}

usuarioActivo=snap.docs[0].data();

pantallaLogin.style.display="none";
app.classList.remove("hidden");

if(usuarioActivo.rol!=="admin"){
document.querySelectorAll(".admin").forEach(el=>el.style.display="none");
}

mostrarSeccion("ventas");
cargarTodo();
}

// CARGAR TODO
function cargarTodo(){

db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
listaServicios.innerHTML+=`<div class="servicio">${s.nombre}<br>$${s.precio}</div>`;
});
});

db.collection("productos").onSnapshot(snap=>{
listaProductos.innerHTML="";
snap.forEach(doc=>{
let p=doc.data();
listaProductos.innerHTML+=`<div class="producto">${p.nombre} - $${p.precio}</div>`;
});
});

db.collection("usuarios").onSnapshot(snap=>{
listaUsuarios.innerHTML="";
snap.forEach(doc=>{
let u=doc.data();
listaUsuarios.innerHTML+=`<div>${u.usuario}</div>`;
});
});

}

// CRUD
async function crearServicio(){
await db.collection("servicios").add({
nombre:nombreServicio.value,
precio:Number(precioServicio.value)
});
}

async function crearProducto(){
await db.collection("productos").add({
nombre:nombreProd.value,
precio:Number(precioProd.value),
stock:Number(stockProd.value)
});
}

async function crearUsuario(){
await db.collection("usuarios").add({
usuario:nuevoUser.value,
password:nuevoPass.value,
rol:nuevoRol.value
});
}

// UI
function mostrarSeccion(id){
if(usuarioActivo.rol!=="admin" && id!=="ventas") return;
document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
}

function logout(){
location.reload();
}

</script>

</body>
</html>
