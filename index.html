<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* 🎨 TEMA AUTO */
:root{
  --bg:#000;
  --card:#1a1a1a;
  --text:#fff;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f5f5;
    --card:#fff;
    --text:#000;
  }
}

body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
.container{padding:15px}
.hidden{display:none}

/* SPLASH */
#splash{position:fixed;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:999}
.splash-logo{width:150px;border-radius:50%;animation:splash 1.5s}
@keyframes splash{0%{scale:0.5;opacity:0}100%{scale:1;opacity:1}}

/* LOGIN */
.logo-container{display:flex;justify-content:center;margin-top:80px}
.logo-login{width:180px;height:180px;border-radius:50%;border:4px solid #00c853}

/* MENU */
.menu{display:flex;justify-content:space-around;margin-bottom:20px}
.menu-item{text-align:center;cursor:pointer}
.icono{width:70px;height:70px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}

/* SECCIONES */
.seccion{display:none}
.seccion.activa{display:block}

.card{background:var(--card);padding:10px;margin-top:10px;border-radius:8px}

/* SERVICIOS */
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.servicio{border-radius:50%;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ccc}
.servicio.activo{border:2px solid #00c853}

/* PRODUCTOS */
.producto{border:2px solid #ccc;padding:10px;border-radius:8px;margin-top:8px}
.producto.activo{border:2px solid #00c853}
.controls{display:flex;justify-content:space-between}

button{width:100%;padding:10px;margin-top:8px;background:#00c853;border:none}
input,select{width:100%;padding:10px;margin-top:5px}

/* LOGOUT */
.logout-btn{position:fixed;bottom:20px;right:20px;width:70px;height:70px;border-radius:50%;background:red;display:flex;justify-content:center;align-items:center;font-size:28px}

</style>
</head>

<body>

<div id="splash">
<img src="icono-192.png" class="splash-logo">
</div>

<div id="pantallaLogin" class="container hidden">
<div class="logo-container">
<img src="icono-192.png" class="logo-login">
</div>

<input id="user" placeholder="Usuario">
<input id="pass" type="password">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="menu">
<div class="menu-item" onclick="mostrarSeccion('ventas')"><div class="icono">💰</div></div>
<div class="menu-item admin" onclick="mostrarSeccion('servicios')"><div class="icono">✂️</div></div>
<div class="menu-item admin" onclick="mostrarSeccion('productos')"><div class="icono">📦</div></div>
<div class="menu-item admin" onclick="mostrarSeccion('usuarios')"><div class="icono">👑</div></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card">
<input id="cliente" placeholder="Cliente">

<h4>Servicios</h4>
<div id="listaServicios" class="servicios-grid"></div>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar Venta</button>
</div>

<!-- SERVICIOS -->
<div id="servicios" class="seccion card">
<input id="nombreServicio">
<input id="precioServicio" type="number">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion card">
<input id="nombreProd">
<input id="precioProd" type="number">
<input id="stockProd" type="number">
<button onclick="crearProducto()">Agregar</button>
<div id="adminProductos"></div>
</div>

<!-- USUARIOS -->
<div id="usuarios" class="seccion card">
<input id="nuevoUser">
<input id="nuevoPass">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<button onclick="crearUsuario()">Crear</button>
<div id="listaUsuarios"></div>
</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

// SPLASH
setTimeout(()=>{
splash.style.display="none";
let u=localStorage.getItem("usuario");
if(u){iniciarApp(JSON.parse(u));}
else{pantallaLogin.classList.remove("hidden");}
},2000);

const firebaseConfig={apiKey:"AIzaSy...",authDomain:"barberia-pro-3ca72.firebaseapp.com",projectId:"barberia-pro-3ca72"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={};

// LOGIN
async function login(){
let snap=await db.collection("usuarios")
.where("usuario","==",user.value)
.where("password","==",pass.value).get();

if(snap.empty){alert("Error");return;}

let usuario=snap.docs[0].data();
localStorage.setItem("usuario",JSON.stringify(usuario));
iniciarApp(usuario);
}

// INICIAR
function iniciarApp(usuario){

usuarioActivo=usuario;

pantallaLogin.style.display="none";
app.classList.remove("hidden");

// 🔥 CONTROL DE ROLES
if(usuario.rol !== "admin"){
document.querySelectorAll(".admin").forEach(el=>el.style.display="none");
}

mostrarSeccion("ventas");
}

// SECCIONES
function mostrarSeccion(id){

if(usuarioActivo.rol !== "admin" && id !== "ventas"){
return;
}

document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
}

// LOGOUT
function logout(){
localStorage.removeItem("usuario");
location.reload();
}

</script>

</body>
</html>
