<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<style>
body {margin:0;font-family:Arial;background:#0b0b0b;color:#fff;}
header {background:#000;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container {padding:15px;}
input, select {width:100%;padding:10px;margin:5px 0;}
button {width:100%;padding:10px;margin-top:8px;background:#00c853;border:none;font-weight:bold;}
.card {background:#1a1a1a;padding:10px;margin-top:10px;border-radius:8px;}
.service-btn, .producto-btn {padding:10px;background:#1c1c1c;border-radius:8px;cursor:pointer;text-align:center;margin-top:5px;}
.active {background:#00c853;color:#000;}
.hidden {display:none;}
.producto-img {width:100%;height:100px;object-fit:cover;border-radius:6px;}
</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<header id="titulo">💈 King’s Barber</header>

<div class="card">
<h3>Registrar Venta</h3>

<input id="cliente" placeholder="Cliente">

<div>
<div class="service-btn" onclick="toggle(this,'Corte',100)">Corte $100</div>
<div class="service-btn" onclick="toggle(this,'Ceja',20)">Ceja $20</div>
<div class="service-btn" onclick="toggle(this,'Facial',150)">Facial $150</div>
</div>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">

<button onclick="guardar()">Guardar Venta</button>
</div>

<div id="panelAdmin" class="card hidden">

<h3>⚙️ Configuración</h3>
<input id="nombreNegocio" placeholder="Nombre negocio">
<input type="file" id="logoNegocio">
<button onclick="guardarConfig()">Guardar Configuración</button>

<h3>👑 Usuarios</h3>
<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Contraseña">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<input id="nuevaComision" type="number" placeholder="Comisión">
<button onclick="crearUsuario()">Crear Usuario</button>
<div id="listaUsuarios"></div>

<h3>📦 Productos</h3>
<input id="nombreProd" placeholder="Nombre">
<input id="precioProd" type="number" placeholder="Precio">
<input id="stockProd" type="number" placeholder="Stock">
<input type="file" id="imagenProd" onchange="previewImagen()">
<img id="preview" style="width:100%;display:none;">
<progress id="barraProgreso" max="100" style="width:100%;display:none;"></progress>
<button id="btnGuardarProducto" onclick="crearProducto()">Agregar Producto</button>

<div id="adminProductos"></div>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "barberia-pro-3ca72.firebaseapp.com",
  projectId: "barberia-pro-3ca72",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let usuarioActivo = {};
let seleccionados = [];
let productosSeleccionados = [];
let totalAuto = 0;

async function login(){
  let snap = await db.collection("usuarios")
  .where("usuario","==",user.value)
  .where("password","==",pass.value)
  .get();

  if(snap.empty){ alert("Error"); return; }

  usuarioActivo = snap.docs[0].data();

  pantallaLogin.style.display="none";
  app.classList.remove("hidden");

  cargarProductos();

  if(usuarioActivo.rol==="admin"){
    panelAdmin.classList.remove("hidden");
    cargarUsuarios();
    cargarProductosAdmin();
  }
}

function toggle(el,s,p){
  el.classList.toggle("active");

  if(seleccionados.includes(s)){
    seleccionados = seleccionados.filter(x=>x!==s);
    totalAuto -= p;
  }else{
    seleccionados.push(s);
    totalAuto += p;
  }

  monto.value = totalAuto;
}

function cargarProductos(){
  db.collection("productos").onSnapshot(snap=>{
    listaProductos.innerHTML="";
    snap.forEach(doc=>{
      let p = doc.data();
      listaProductos.innerHTML+=`
      <div class="producto-btn" onclick="seleccionarProducto('${doc.id}',${p.precio},this)">
        <img src="${p.imagen}" class="producto-img">
        ${p.nombre}<br>$${p.precio} | Stock: ${p.stock}
      </div>`;
    });
  });
}

function seleccionarProducto(id,precio,el){
  let index = productosSeleccionados.find(p=>p.id===id);

  if(index){
    productosSeleccionados = productosSeleccionados.filter(p=>p.id!==id);
    totalAuto -= precio;
    el.classList.remove("active");
  }else{
    productosSeleccionados.push({id,precio});
    totalAuto += precio;
    el.classList.add("active");
  }

  monto.value = totalAuto;
}

async function guardar(){

  if(!cliente.value || !metodoPago.value){
    alert("Completa todo");
    return;
  }

  for(let p of productosSeleccionados){
    let ref = db.collection("productos").doc(p.id);
    let snap = await ref.get();
    if(snap.data().stock<=0){ alert("Sin stock"); return; }
    await ref.update({stock: snap.data().stock-1});
  }

  await db.collection("ventas").add({
    cliente:cliente.value,
    servicios:[...seleccionados],
    productos:[...productosSeleccionados],
    metodoPago:metodoPago.value,
    total:totalAuto,
    barbero:usuarioActivo.usuario,
    comision:usuarioActivo.comision,
    fecha:new Date().toISOString()
  });

  alert("Venta guardada");
  location.reload();
}

// PRODUCTOS
function previewImagen(){
  let file = imagenProd.files[0];
  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display="block";
  }
}

async function crearProducto(){

  let file = imagenProd.files[0];
  if(!file){ alert("Selecciona imagen"); return; }

  btnGuardarProducto.disabled=true;
  barraProgreso.style.display="block";

  let ref = storage.ref("productos/"+Date.now()+"_"+file.name);
  let task = ref.put(file);

  task.on("state_changed",
    s=>{
      barraProgreso.value = (s.bytesTransferred/s.totalBytes)*100;
    },
    e=>alert("Error"),
    async ()=>{
      let url = await ref.getDownloadURL();

      await db.collection("productos").add({
        nombre:nombreProd.value,
        precio:Number(precioProd.value),
        stock:Number(stockProd.value),
        imagen:url
      });

      alert("Producto creado");

      btnGuardarProducto.disabled=false;
      barraProgreso.style.display="none";
      preview.style.display="none";
    }
  );
}

function cargarProductosAdmin(){
  db.collection("productos").onSnapshot(snap=>{
    adminProductos.innerHTML="";
    snap.forEach(doc=>{
      let p = doc.data();
      adminProductos.innerHTML+=`
      <div class="card">
        <img src="${p.imagen}" class="producto-img">
        <input value="${p.nombre}" id="n${doc.id}">
        <input value="${p.precio}" id="p${doc.id}">
        <input value="${p.stock}" id="s${doc.id}">
        <input type="file" id="img${doc.id}">
        <button onclick="editarProducto('${doc.id}')">Guardar</button>
        <button onclick="eliminarProducto('${doc.id}')">Eliminar</button>
      </div>`;
    });
  });
}

async function editarProducto(id){
  let data={
    nombre:document.getElementById("n"+id).value,
    precio:Number(document.getElementById("p"+id).value),
    stock:Number(document.getElementById("s"+id).value)
  };

  let file=document.getElementById("img"+id).files[0];

  if(file){
    let ref=storage.ref("productos/"+Date.now()+file.name);
    await ref.put(file);
    data.imagen=await ref.getDownloadURL();
  }

  await db.collection("productos").doc(id).update(data);
}

async function eliminarProducto(id){
  await db.collection("productos").doc(id).delete();
}

// USUARIOS
async function crearUsuario(){
  await db.collection("usuarios").add({
    usuario:nuevoUser.value,
    password:nuevoPass.value,
    rol:nuevoRol.value,
    comision:Number(nuevaComision.value)
  });
}

function cargarUsuarios(){
  db.collection("usuarios").onSnapshot(snap=>{
    listaUsuarios.innerHTML="";
    snap.forEach(doc=>{
      let u=doc.data();
      listaUsuarios.innerHTML+=`
      <div class="card">
      ${u.usuario} - ${u.rol}
      <button onclick="db.collection('usuarios').doc('${doc.id}').delete()">Eliminar</button>
      </div>`;
    });
  });
}

// CONFIG
async function guardarConfig(){
  let file = logoNegocio.files[0];
  let data = {nombre:nombreNegocio.value};

  if(file){
    let ref=storage.ref("config/logo.png");
    await ref.put(file);
    data.logo=await ref.getDownloadURL();
  }

  await db.collection("config").doc("general").set(data);
  titulo.innerText = nombreNegocio.value;
}

</script>

</body>
</html>
