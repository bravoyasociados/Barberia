<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {margin:0;font-family:Arial;background:#000;color:#fff;}
.container {padding:15px;}
.card {background:#1a1a1a;padding:10px;margin-top:10px;border-radius:8px;}

.producto {
  border:2px solid #333;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
}

.producto.activo {
  border:2px solid #00c853;
}

.controls {
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

button {padding:8px;background:#00c853;border:none;color:#000;}
input, select {width:100%;padding:8px;margin-top:5px;}
.hidden {display:none;}
</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="card">
<h3>Registrar Venta</h3>

<input id="cliente" placeholder="Cliente">

<button onclick="toggleServicio('Corte',100)">Corte $100</button>
<button onclick="toggleServicio('Ceja',20)">Ceja $20</button>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar Venta</button>

</div>

<div id="panelAdmin" class="hidden">

<div class="card">
<h3>Productos</h3>

<input id="nombreProd" placeholder="Nombre">
<input id="precioProd" type="number" placeholder="Precio">
<input id="stockProd" type="number" placeholder="Stock">
<button onclick="crearProducto()">Agregar Producto</button>

<div id="adminProductos"></div>
</div>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "barberia-pro-3ca72.firebaseapp.com",
  projectId: "barberia-pro-3ca72",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let usuarioActivo = {};
let servicios = [];
let carrito = {};
let total = 0;

// LOGIN
async function login(){
  let snap = await db.collection("usuarios")
  .where("usuario","==",user.value)
  .where("password","==",pass.value)
  .get();

  if(snap.empty){ alert("Error"); return; }

  usuarioActivo = snap.docs[0].data();

  pantallaLogin.style.display="none";
  app.classList.remove("hidden");

  cargarProductos();

  if(usuarioActivo.rol==="admin"){
    panelAdmin.classList.remove("hidden");
    cargarProductosAdmin();
  }
}

// SERVICIOS
function toggleServicio(nombre,precio){
  if(servicios.includes(nombre)){
    servicios = servicios.filter(s=>s!==nombre);
    total -= precio;
  }else{
    servicios.push(nombre);
    total += precio;
  }
  monto.value = total;
}

// PRODUCTOS
function cargarProductos(){
  db.collection("productos").onSnapshot(snap=>{
    listaProductos.innerHTML="";

    snap.forEach(doc=>{
      let p=doc.data();
      let cantidad = carrito[doc.id]?.cantidad || 0;

      listaProductos.innerHTML+=`
      <div class="producto ${cantidad>0 ? 'activo':''}">
        ${p.nombre} - $${p.precio}<br>
        Stock: ${p.stock}

        <div class="controls">
          <button onclick="cambiarCantidad('${doc.id}',-1,${p.precio},${p.stock})">-</button>
          <span>${cantidad}</span>
          <button onclick="cambiarCantidad('${doc.id}',1,${p.precio},${p.stock})">+</button>
        </div>
      </div>`;
    });
  });
}

// CAMBIAR CANTIDAD
function cambiarCantidad(id,delta,precio,stock){

  if(!carrito[id]) carrito[id] = {cantidad:0,precio};

  let nueva = carrito[id].cantidad + delta;

  if(nueva < 0) nueva = 0;
  if(nueva > stock){
    alert("No hay más stock");
    return;
  }

  total += (nueva - carrito[id].cantidad) * precio;

  carrito[id].cantidad = nueva;

  if(nueva === 0) delete carrito[id];

  monto.value = total;

  cargarProductos();
}

// GUARDAR
async function guardar(){

  if(!cliente.value || !metodoPago.value){
    alert("Completa datos");
    return;
  }

  for(let id in carrito){
    let ref = db.collection("productos").doc(id);
    let snap = await ref.get();

    let nuevoStock = snap.data().stock - carrito[id].cantidad;

    if(nuevoStock < 0){
      alert("Stock insuficiente");
      return;
    }

    await ref.update({stock: nuevoStock});
  }

  await db.collection("ventas").add({
    cliente:cliente.value,
    servicios,
    productos:carrito,
    metodoPago:metodoPago.value,
    total,
    barbero:usuarioActivo.usuario,
    comision:usuarioActivo.comision,
    fecha:new Date().toISOString()
  });

  alert("Venta guardada");
  location.reload();
}

// ADMIN PRODUCTOS
async function crearProducto(){
  await db.collection("productos").add({
    nombre:nombreProd.value,
    precio:Number(precioProd.value),
    stock:Number(stockProd.value)
  });
}

function cargarProductosAdmin(){
  db.collection("productos").onSnapshot(snap=>{
    adminProductos.innerHTML="";
    snap.forEach(doc=>{
      let p=doc.data();
      adminProductos.innerHTML+=`
      <div class="card">
        <input value="${p.nombre}" id="n${doc.id}">
        <input value="${p.precio}" id="p${doc.id}">
        <input value="${p.stock}" id="s${doc.id}">
        <button onclick="editarProducto('${doc.id}')">Guardar</button>
        <button onclick="db.collection('productos').doc('${doc.id}').delete()">Eliminar</button>
      </div>`;
    });
  });
}

async function editarProducto(id){
  await db.collection("productos").doc(id).update({
    nombre:document.getElementById("n"+id).value,
    precio:Number(document.getElementById("p"+id).value),
    stock:Number(document.getElementById("s"+id).value)
  });
}

</script>

</body>
</html>
