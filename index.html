<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {margin:0;font-family:Arial;background:#0b0b0b;color:#fff;}
header {background:#000;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container {padding:15px;}
input, select {width:100%;padding:10px;margin:5px 0;}
button {width:100%;padding:12px;margin-top:8px;background:#00c853;border:none;font-weight:bold;}
.card {background:#1a1a1a;padding:10px;margin-top:10px;border-radius:8px;}
.services {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.service-btn, .producto-btn {padding:12px;background:#1c1c1c;text-align:center;border-radius:8px;cursor:pointer;}
.active {background:#00c853;color:#000;}
.hidden {display:none;}
.logo {display:block;margin:40px auto;width:150px;}
</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<img src="icono-192.png" class="logo">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<header>💈 King’s Barber</header>

<div class="card">
<h3>Registrar Venta</h3>

<input id="cliente" placeholder="Cliente">

<div class="services">
<div class="service-btn" onclick="toggle(this,'Corte',100)">Corte $100</div>
<div class="service-btn" onclick="toggle(this,'Ceja',20)">Ceja $20</div>
<div class="service-btn" onclick="toggle(this,'Facial',150)">Facial $150</div>
<div class="service-btn" onclick="toggle(this,'Especial',150)">Especial $150</div>
</div>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">

<button onclick="guardar()">Guardar Venta</button>
</div>

<!-- ADMIN -->
<div id="panelAdmin" class="card hidden">

<h3>👑 Usuarios</h3>
<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Contraseña">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<input id="nuevaComision" type="number" placeholder="Comisión">
<button onclick="crearUsuario()">Crear Usuario</button>

<div id="listaUsuarios"></div>

<h3>📦 Productos</h3>
<input id="nombreProd" placeholder="Nombre">
<input id="precioProd" type="number" placeholder="Precio">
<input id="stockProd" type="number" placeholder="Stock">

<button onclick="crearProducto()">Agregar Producto</button>

<div id="adminProductos"></div>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "barberia-pro-3ca72.firebaseapp.com",
  projectId: "barberia-pro-3ca72",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let usuarioActivo = {};
let seleccionados = [];
let productosSeleccionados = [];
let totalAuto = 0;

// LOGIN
async function login(){

  let u = user.value;
  let p = pass.value;

  let snap = await db.collection("usuarios")
  .where("usuario","==",u)
  .where("password","==",p)
  .get();

  if(snap.empty){ alert("Error"); return; }

  let data = snap.docs[0].data();

  usuarioActivo = data;

  pantallaLogin.style.display="none";
  app.classList.remove("hidden");

  cargarProductos();

  if(data.rol==="admin"){
    panelAdmin.classList.remove("hidden");
    cargarUsuarios();
    cargarProductosAdmin();
  }
}

// SERVICIOS
function toggle(el,s,p){
  el.classList.toggle("active");

  if(seleccionados.includes(s)){
    seleccionados = seleccionados.filter(x=>x!==s);
    totalAuto -= p;
  }else{
    seleccionados.push(s);
    totalAuto += p;
  }

  monto.value = totalAuto;
}

// PRODUCTOS (BARBERO)
function cargarProductos(){
  db.collection("productos").onSnapshot(snap=>{
    listaProductos.innerHTML="";

    snap.forEach(doc=>{
      let p = doc.data();

      listaProductos.innerHTML+=`
      <div class="producto-btn" onclick="seleccionarProducto('${doc.id}',${p.precio},this)">
        ${p.nombre} - $${p.precio} (Stock: ${p.stock})
      </div>`;
    });
  });
}

function seleccionarProducto(id,precio,el){

  let index = productosSeleccionados.find(p=>p.id===id);

  if(index){
    productosSeleccionados = productosSeleccionados.filter(p=>p.id!==id);
    totalAuto -= precio;
    el.classList.remove("active");
  }else{
    productosSeleccionados.push({id,precio});
    totalAuto += precio;
    el.classList.add("active");
  }

  monto.value = totalAuto;
}

// GUARDAR
async function guardar(){

  let cliente = cliente.value;
  let metodoPago = metodoPago.value;

  if(!cliente || !metodoPago || seleccionados.length===0){
    alert("Completa todo");
    return;
  }

  // descontar stock
  for(let p of productosSeleccionados){
    let ref = db.collection("productos").doc(p.id);
    let snap = await ref.get();

    let stock = snap.data().stock;

    if(stock<=0){
      alert("Sin stock");
      return;
    }

    await ref.update({stock: stock-1});
  }

  await db.collection("ventas").add({
    cliente,
    servicios:[...seleccionados],
    productos:[...productosSeleccionados],
    metodoPago,
    total: totalAuto,
    barbero: usuarioActivo.usuario,
    comision: usuarioActivo.comision,
    fecha:new Date().toISOString()
  });

  alert("Venta guardada");

  location.reload();
}

// ADMIN PRODUCTOS
async function crearProducto(){

  let nombre = nombreProd.value;
  let precio = Number(precioProd.value);
  let stock = Number(stockProd.value);

  if(!nombre || !precio){
    alert("Datos incompletos");
    return;
  }

  await db.collection("productos").add({
    nombre,
    precio,
    stock
  });

  nombreProd.value="";
  precioProd.value="";
  stockProd.value="";
}

function cargarProductosAdmin(){

  db.collection("productos").onSnapshot(snap=>{
    adminProductos.innerHTML="";

    snap.forEach(doc=>{
      let p = doc.data();

      adminProductos.innerHTML+=`
      <div class="card">
        ${p.nombre} - $${p.precio} - Stock: ${p.stock}
        <button onclick="eliminarProducto('${doc.id}')">Eliminar</button>
      </div>`;
    });
  });
}

async function eliminarProducto(id){
  await db.collection("productos").doc(id).delete();
}

// USUARIOS
async function crearUsuario(){
  await db.collection("usuarios").add({
    usuario:nuevoUser.value,
    password:nuevoPass.value,
    rol:nuevoRol.value,
    comision:Number(nuevaComision.value)
  });
}

function cargarUsuarios(){
  db.collection("usuarios").onSnapshot(snap=>{
    listaUsuarios.innerHTML="";
    snap.forEach(doc=>{
      let u=doc.data();
      listaUsuarios.innerHTML+=`
      <div class="card">
      ${u.usuario} - ${u.rol}
      <button onclick="db.collection('usuarios').doc('${doc.id}').delete()">Eliminar</button>
      </div>`;
    });
  });
}

</script>

</body>
</html>
