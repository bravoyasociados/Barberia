<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {margin:0;font-family:Arial;background:#0b0b0b;color:#fff;}
header {background:#000;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container {padding:15px;}
input, select {width:100%;padding:10px;margin:5px 0;}
button {width:100%;padding:12px;margin-top:8px;background:#00c853;border:none;font-weight:bold;}
.card {background:#1a1a1a;padding:10px;margin-top:10px;border-radius:8px;}
.services {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.service-btn {padding:15px;background:#1c1c1c;text-align:center;border-radius:8px;cursor:pointer;}
.service-btn.active {background:#00c853;color:#000;}
.hidden {display:none;}
.logo {display:block;margin:40px auto;width:150px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="pantallaLogin" class="container">
<img src="icono-192.png" class="logo">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="container hidden">

<header>💈 King’s Barber</header>

<!-- REGISTRAR VENTA -->
<div class="card">
<h3>Registrar Venta</h3>

<input id="cliente" placeholder="Cliente">

<div class="services">
<div class="service-btn" onclick="toggle(this,'Corte',100)">Corte $100</div>
<div class="service-btn" onclick="toggle(this,'Ceja y barba',20)">Ceja y barba $20</div>
<div class="service-btn" onclick="toggle(this,'Facial',150)">Facial $150</div>
<div class="service-btn" onclick="toggle(this,'Especial',150)">Especial $150</div>
</div>

<select id="metodoPago">
<option value="">Seleccionar método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">

<button onclick="guardar()">Guardar Venta</button>
</div>

<!-- PANEL ADMIN -->
<div id="panelAdmin" class="card hidden">
<h3>👑 Panel Admin - Usuarios</h3>

<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Contraseña">

<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>

<input id="nuevaComision" type="number" placeholder="Comisión (ej: 50)">

<button onclick="crearUsuario()">Crear Usuario</button>

<div id="listaUsuarios"></div>
</div>

</div>

<script>

// FIREBASE CONFIG (NO CAMBIES)
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "barberia-pro-3ca72.firebaseapp.com",
  projectId: "barberia-pro-3ca72",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let seleccionados = [];
let totalAuto = 0;
let usuarioActivo = {};

// LOGIN
async function login(){

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  let snap = await db.collection("usuarios")
    .where("usuario","==",u)
    .where("password","==",p)
    .get();

  if(snap.empty){
    alert("Usuario incorrecto");
    return;
  }

  let data = snap.docs[0].data();

  usuarioActivo = {
    nombre: data.usuario,
    rol: data.rol,
    comision: data.comision || 0
  };

  document.getElementById("pantallaLogin").style.display="none";
  document.getElementById("app").classList.remove("hidden");

  if(usuarioActivo.rol === "admin"){
    document.getElementById("panelAdmin").classList.remove("hidden");
    cargarUsuarios();
  }
}

// SERVICIOS
function toggle(el,s,p){
  el.classList.toggle("active");

  if(seleccionados.includes(s)){
    seleccionados = seleccionados.filter(x=>x!==s);
    totalAuto -= p;
  }else{
    seleccionados.push(s);
    totalAuto += p;
  }

  document.getElementById("monto").value = totalAuto;
}

// GUARDAR VENTA
async function guardar(){

  let cliente = document.getElementById("cliente").value;
  let metodoPago = document.getElementById("metodoPago").value;

  if(!cliente || seleccionados.length===0 || !metodoPago){
    alert("Completa todos los campos");
    return;
  }

  await db.collection("ventas").add({
    cliente,
    servicios:[...seleccionados],
    productos: [],
    metodoPago,
    total: totalAuto,
    barbero: usuarioActivo.nombre,
    comision: usuarioActivo.comision,
    fecha:new Date().toISOString()
  });

  document.getElementById("cliente").value="";
  document.getElementById("monto").value="";
  document.getElementById("metodoPago").value="";
  seleccionados=[];
  totalAuto=0;

  document.querySelectorAll(".service-btn").forEach(b=>b.classList.remove("active"));

  alert("Venta guardada ✅");
}

// CREAR USUARIO
async function crearUsuario(){

  let usuario = document.getElementById("nuevoUser").value;
  let password = document.getElementById("nuevoPass").value;
  let rol = document.getElementById("nuevoRol").value;
  let comision = Number(document.getElementById("nuevaComision").value);

  if(!usuario || !password){
    alert("Completa los datos");
    return;
  }

  await db.collection("usuarios").add({
    usuario,
    password,
    rol,
    comision
  });

  alert("Usuario creado ✅");

  document.getElementById("nuevoUser").value="";
  document.getElementById("nuevoPass").value="";
  document.getElementById("nuevaComision").value="";

  cargarUsuarios();
}

// CARGAR USUARIOS
function cargarUsuarios(){

  db.collection("usuarios").onSnapshot(snap=>{

    let cont = document.getElementById("listaUsuarios");
    cont.innerHTML="";

    snap.forEach(doc=>{
      let u = doc.data();

      cont.innerHTML += `
      <div class="card">
        ${u.usuario} | ${u.rol} | $${u.comision}
        <button onclick="eliminarUsuario('${doc.id}')">Eliminar</button>
      </div>
      `;
    });

  });
}

// ELIMINAR USUARIO
async function eliminarUsuario(id){

  if(!confirm("¿Eliminar usuario?")) return;

  await db.collection("usuarios").doc(id).delete();
}

</script>

</body>
</html>
