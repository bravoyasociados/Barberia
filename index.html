<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:linear-gradient(135deg,#0f0f0f,#1c1c1c);color:#fff}
.container{padding:15px}
.hidden{display:none}

/* LOGIN */
.logo-login{width:180px;height:180px;border-radius:50%;display:block;margin:40px auto;border:4px solid #00c853;box-shadow:0 0 25px #00c853}

/* MENU */
.menu{display:flex;justify-content:space-around;margin-bottom:20px}
.menu-item{text-align:center;cursor:pointer}
.icono{width:70px;height:70px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;font-size:28px}

/* CARD */
.card{background:#1f1f1f;border-radius:15px;padding:15px}

/* INPUT */
input,select{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff}

/* BOTON */
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:10px;background:#00c853;color:#000}

/* SERVICIOS */
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.servicio{background:#1f1f1f;padding:10px;border-radius:10px;text-align:center}
.servicio.activo{background:#00c853;color:#000}

/* PRODUCTOS */
.producto{background:#1f1f1f;padding:10px;border-radius:10px;margin-top:10px}
.controls{display:flex;justify-content:space-between;margin-top:5px}
.controls button{width:40px}

/* LOGOUT */
.logout-btn{position:fixed;bottom:20px;right:20px;width:65px;height:65px;border-radius:50%;background:red;display:flex;align-items:center;justify-content:center;font-size:26px}

.seccion{display:none}
.seccion.activa{display:block}
</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<img src="icono-192.png" class="logo-login">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="menu">
<div onclick="mostrarSeccion('ventas')"><div class="icono">💰</div></div>
<div class="admin" onclick="mostrarSeccion('servicios')"><div class="icono">✂️</div></div>
<div class="admin" onclick="mostrarSeccion('productos')"><div class="icono">📦</div></div>
<div class="admin" onclick="mostrarSeccion('usuarios')"><div class="icono">👑</div></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card activa">
<input id="cliente" placeholder="Cliente">
<div id="listaServicios" class="servicios-grid"></div>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar</button>
</div>

<!-- SERVICIOS -->
<div id="servicios" class="seccion card">
<input id="nombreServicio" placeholder="Nombre">
<input id="precioServicio" type="number">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion card">
<input id="nombreProd" placeholder="Nombre">
<input id="precioProd" type="number">
<input id="stockProd" type="number">
<button onclick="crearProducto()">Agregar</button>
<div id="adminProductos"></div>
</div>

<!-- USUARIOS -->
<div id="usuarios" class="seccion card">
<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Contraseña">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<button onclick="crearUsuario()">Crear</button>
<div id="listaUsuarios"></div>
</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

const firebaseConfig={apiKey:"AIzaSy...",authDomain:"barberia-pro-3ca72.firebaseapp.com",projectId:"barberia-pro-3ca72"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={},carrito={},total=0,serviciosSel=[];

/* LOGIN */
async function login(){
let snap=await db.collection("usuarios").where("usuario","==",user.value).where("password","==",pass.value).get();
if(snap.empty)return alert("Error");
usuarioActivo=snap.docs[0].data();
pantallaLogin.style.display="none";
app.classList.remove("hidden");
if(usuarioActivo.rol!=="admin")document.querySelectorAll(".admin").forEach(e=>e.style.display="none");
cargarTodo();
}

/* CRUD */
async function crearServicio(){
await db.collection("servicios").add({nombre:nombreServicio.value,precio:Number(precioServicio.value)});
nombreServicio.value="";precioServicio.value="";
}

async function crearProducto(){
await db.collection("productos").add({nombre:nombreProd.value,precio:Number(precioProd.value),stock:Number(stockProd.value)});
nombreProd.value="";precioProd.value="";stockProd.value="";
}

async function crearUsuario(){
await db.collection("usuarios").add({usuario:nuevoUser.value,password:nuevoPass.value,rol:nuevoRol.value});
nuevoUser.value="";nuevoPass.value="";
}

/* EDITAR / ELIMINAR */
async function editarServicio(id,n,p){
let nn=prompt("Nombre",n);
let np=prompt("Precio",p);
if(!nn||!np)return;
await db.collection("servicios").doc(id).update({nombre:nn,precio:Number(np)});
}

async function eliminarServicio(id){
if(confirm("Eliminar?"))await db.collection("servicios").doc(id).delete();
}

async function editarProducto(id,n,p,s){
let nn=prompt("Nombre",n);
let np=prompt("Precio",p);
let ns=prompt("Stock",s);
if(!nn||!np||!ns)return;
await db.collection("productos").doc(id).update({nombre:nn,precio:Number(np),stock:Number(ns)});
}

async function eliminarProducto(id){
if(confirm("Eliminar?"))await db.collection("productos").doc(id).delete();
}

/* CARGAR */
function cargarTodo(){

db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
adminServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
listaServicios.innerHTML+=`<div class="servicio" onclick="toggleServicio('${s.nombre}',${s.precio})">${s.nombre}<br>$${s.precio}</div>`;
adminServicios.innerHTML+=`<div class="producto">${s.nombre} $${s.precio}<div class="controls"><button onclick="editarServicio('${doc.id}','${s.nombre}',${s.precio})">✏️</button><button onclick="eliminarServicio('${doc.id}')">🗑</button></div></div>`;
});
});

db.collection("productos").onSnapshot(snap=>{
listaProductos.innerHTML="";
adminProductos.innerHTML="";
snap.forEach(doc=>{
let p=doc.data();
let c=carrito[doc.id]?.cantidad||0;
listaProductos.innerHTML+=`<div class="producto">${p.nombre} - $${p.precio} (Stock:${p.stock})<div class="controls"><button onclick="cambiar('${doc.id}',-1,${p.precio},${p.stock})">-</button><span>${c}</span><button onclick="cambiar('${doc.id}',1,${p.precio},${p.stock})">+</button></div></div>`;
adminProductos.innerHTML+=`<div class="producto">${p.nombre} $${p.precio}<div class="controls"><button onclick="editarProducto('${doc.id}','${p.nombre}',${p.precio},${p.stock})">✏️</button><button onclick="eliminarProducto('${doc.id}')">🗑</button></div></div>`;
});
});

db.collection("usuarios").onSnapshot(snap=>{
listaUsuarios.innerHTML="";
snap.forEach(doc=>{
let u=doc.data();
listaUsuarios.innerHTML+=`<div>${u.usuario} - ${u.rol}</div>`;
});
});

}

/* LÓGICA */
function toggleServicio(n,p){serviciosSel.push(n);total+=p;monto.value=total}
function cambiar(id,d,p,s){if(!carrito[id])carrito[id]={cantidad:0,precio:p};let n=carrito[id].cantidad+d;if(n<0)n=0;if(n>s)return;total+=(n-carrito[id].cantidad)*p;carrito[id].cantidad=n;monto.value=total}
async function guardar(){for(let id in carrito){await db.collection("productos").doc(id).update({stock:firebase.firestore.FieldValue.increment(-carrito[id].cantidad)})}await db.collection("ventas").add({cliente:cliente.value,total});alert("Guardado")}

/* UI */
function mostrarSeccion(id){document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));document.getElementById(id).classList.add("activa")}
function logout(){location.reload()}

</script>

</body>
</html>
