<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- 📊 GRAFICAS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:#111;color:#fff}
.container{padding:15px}
.hidden{display:none}
.header{display:flex;justify-content:center;position:relative;margin-bottom:15px}
.logo-mini{position:absolute;left:0}
.logo-mini img{width:50px;border-radius:50%}
.titulo{font-size:20px;font-weight:bold}
.logo-login{width:180px;border-radius:50%;display:block;margin:40px auto;border:4px solid #00c853}
.menu{display:flex;justify-content:space-around;margin-bottom:20px}
.menu-item{text-align:center;cursor:pointer;position:relative}
.menu-item span{font-size:12px;color:#aaa}
.menu-item.active span{color:#00e676}
.menu-item.active::after{content:"";position:absolute;bottom:-5px;left:20%;width:60%;height:3px;background:#00c853}
.icono{width:70px;height:70px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;font-size:28px}
.card{background:#1f1f1f;border-radius:15px;padding:15px}
input,select{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff}
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:10px;background:#00c853;color:#000}
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.servicio{background:#1f1f1f;padding:10px;border-radius:10px;text-align:center;border:1px solid #333}
.servicio.activo{background:#00c853;color:#000}
.producto{background:#1f1f1f;padding:10px;border-radius:10px;margin-top:10px;border:1px solid #333}
.controls{display:flex;justify-content:space-between;margin-top:5px}
.logout-btn{position:fixed;bottom:20px;right:20px;width:65px;height:65px;border-radius:50%;background:red;display:flex;align-items:center;justify-content:center;font-size:26px}
.seccion{display:none}
.seccion.activa{display:block}
canvas{margin-top:15px;background:#fff;border-radius:10px}
</style>
</head>

<body>

<div id="pantallaLogin" class="container hidden">
<img src="icono-192.png" class="logo-login">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="header">
<div class="logo-mini"><img src="icono-192.png"></div>
<div class="titulo">King’s Barber</div>
</div>

<div class="menu">
<div class="menu-item active" onclick="mostrarSeccion('ventas',this)"><div class="icono">💰</div><span>Ventas</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('servicios',this)"><div class="icono">✂️</div><span>Servicios</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('productos',this)"><div class="icono">📦</div><span>Productos</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('usuarios',this)"><div class="icono">👑</div><span>Usuarios</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('reportes',this)"><div class="icono">📊</div><span>Reportes</span></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card activa">
<input id="cliente" placeholder="Cliente">
<h4>Servicios</h4>
<div id="listaServicios" class="servicios-grid"></div>
<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar</button>
</div>

<!-- SERVICIOS ADMIN -->
<div id="servicios" class="seccion card">
<input id="nombreServicio" placeholder="Nombre">
<input id="precioServicio" type="number">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- REPORTES -->
<div id="reportes" class="seccion card">

<h3>📊 Reportes PRO</h3>

<input type="date" id="fechaInicio">
<input type="date" id="fechaFin">

<select id="filtroBarbero"></select>

<button onclick="generarReporte()">Generar</button>
<button onclick="exportarExcel()">Exportar Excel</button>

<h4>Total</h4>
<div id="totalVentas">$0</div>

<div id="tablaReporte"></div>

<canvas id="graficaBarberos"></canvas>
<canvas id="graficaServicios"></canvas>
<canvas id="graficaProductos"></canvas>

</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

const firebaseConfig={apiKey:"AIzaSy...",authDomain:"barberia-pro-3ca72.firebaseapp.com",projectId:"barberia-pro-3ca72"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={},serviciosSel=[],carrito={},total=0;

/* LOGIN */
window.onload=()=>{
let u=localStorage.getItem("usuario");
if(u) iniciarApp(JSON.parse(u));
else pantallaLogin.classList.remove("hidden");
};

async function login(){
let snap=await db.collection("usuarios").where("usuario","==",user.value).where("password","==",pass.value).get();
if(snap.empty)return alert("Error");
let usuario=snap.docs[0].data();
localStorage.setItem("usuario",JSON.stringify(usuario));
iniciarApp(usuario);
}

function iniciarApp(usuario){
usuarioActivo=usuario;
pantallaLogin.style.display="none";
app.classList.remove("hidden");

cargarServicios();
cargarServiciosAdmin();
cargarBarberos();
}

/* SERVICIOS */
function cargarServicios(){
db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
listaServicios.innerHTML+=`<div class="servicio" onclick="toggleServicio('${s.nombre}',${s.precio})">${s.nombre}<br>$${s.precio}</div>`;
});
});
}

function cargarServiciosAdmin(){
db.collection("servicios").onSnapshot(snap=>{
adminServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
adminServicios.innerHTML+=`
<div class="producto">
${s.nombre} $${s.precio}
<div class="controls">
<button onclick="editarServicio('${doc.id}','${s.nombre}',${s.precio})">✏️</button>
<button onclick="eliminarServicio('${doc.id}')">🗑</button>
</div>
</div>`;
});
});
}

async function editarServicio(id,n,p){
let nn=prompt("Nombre",n);
let np=prompt("Precio",p);
if(!nn||!np)return;
await db.collection("servicios").doc(id).update({nombre:nn,precio:Number(np)});
}

async function eliminarServicio(id){
if(confirm("Eliminar?"))await db.collection("servicios").doc(id).delete();
}

/* REPORTE PRO */
async function generarReporte(){

let snap=await db.collection("ventas").get();

let porBarbero={},porServicio={},porProducto={},total=0;

snap.forEach(doc=>{
let v=doc.data();

total+=Number(v.total);

// barbero
if(!porBarbero[v.barbero]) porBarbero[v.barbero]=0;
porBarbero[v.barbero]+=Number(v.total);

// servicios
(v.servicios||[]).forEach(s=>{
if(!porServicio[s]) porServicio[s]=0;
porServicio[s]++;
});

// productos
for(let id in (v.productos||{})){
if(!porProducto[id]) porProducto[id]=0;
porProducto[id]+=v.productos[id].cantidad;
}

});

totalVentas.innerHTML="$"+total;

/* GRAFICAS */
new Chart(graficaBarberos,{type:'bar',data:{labels:Object.keys(porBarbero),datasets:[{data:Object.values(porBarbero)}]}})
new Chart(graficaServicios,{type:'bar',data:{labels:Object.keys(porServicio),datasets:[{data:Object.values(porServicio)}]}})
new Chart(graficaProductos,{type:'bar',data:{labels:Object.keys(porProducto),datasets:[{data:Object.values(porProducto)}]}})

}

/* EXCEL */
function exportarExcel(){
let csv="tipo,nombre,total\n";

document.querySelectorAll("canvas").forEach(()=>{}); // placeholder

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="reporte.csv";
a.click();
}

function logout(){
localStorage.removeItem("usuario");
location.reload();
}

</script>

</body>
</html>
