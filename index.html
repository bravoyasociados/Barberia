<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:linear-gradient(135deg,#0f0f0f,#1c1c1c);color:#fff}
.container{padding:15px}
.hidden{display:none}

/* HEADER */
.header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:15px}
.logo-mini{position:absolute;left:0}
.logo-mini img{width:50px;height:50px;border-radius:50%}
.titulo{font-size:20px;font-weight:bold}

/* LOGIN */
.logo-login{width:180px;height:180px;border-radius:50%;display:block;margin:40px auto;border:4px solid #00c853;box-shadow:0 0 25px #00c853}

/* MENU */
.menu{display:flex;justify-content:space-around;margin-bottom:20px}
.menu-item{text-align:center;cursor:pointer;position:relative}
.menu-item span{font-size:12px;color:#aaa}
.menu-item.active span{color:#00e676}
.menu-item.active::after{content:"";position:absolute;bottom:-5px;left:20%;width:60%;height:3px;background:#00c853;border-radius:3px}
.icono{width:70px;height:70px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;font-size:28px}

/* CARD */
.card{background:#1f1f1f;border-radius:15px;padding:15px}

/* INPUT */
input,select{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff}

/* BOTON */
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:10px;background:#00c853;color:#000}

/* SERVICIOS */
.servicios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.servicio{background:#1f1f1f;padding:10px;border-radius:10px;text-align:center;border:1px solid #333}
.servicio.activo{background:#00c853;color:#000}

/* PRODUCTOS */
.producto{background:#1f1f1f;padding:10px;border-radius:10px;margin-top:10px;border:1px solid #333}
.controls{display:flex;justify-content:space-between;margin-top:5px}
.controls button{width:40px}

/* LOGOUT */
.logout-btn{position:fixed;bottom:20px;right:20px;width:65px;height:65px;border-radius:50%;background:red;display:flex;align-items:center;justify-content:center;font-size:26px}

.seccion{display:none}
.seccion.activa{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="pantallaLogin" class="container hidden">
<img src="icono-192.png" class="logo-login">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="container hidden">

<div class="header">
<div class="logo-mini"><img src="icono-192.png"></div>
<div class="titulo">King’s Barber</div>
</div>

<div class="menu">
<div class="menu-item active" onclick="mostrarSeccion('ventas',this)"><div class="icono">💰</div><span>Ventas</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('servicios',this)"><div class="icono">✂️</div><span>Servicios</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('productos',this)"><div class="icono">📦</div><span>Productos</span></div>
<div class="menu-item admin" onclick="mostrarSeccion('usuarios',this)"><div class="icono">👑</div><span>Usuarios</span></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card activa">
<h3>💰 Ventas</h3>
<input id="cliente" placeholder="Cliente">

<h4>Servicios</h4>
<div id="listaServicios" class="servicios-grid"></div>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Método</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total">
<button onclick="guardar()">Guardar</button>
</div>

<!-- SERVICIOS -->
<div id="servicios" class="seccion card">
<h3>✂️ Servicios</h3>
<input id="nombreServicio" placeholder="Nombre">
<input id="precioServicio" type="number" placeholder="Precio">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion card">
<h3>📦 Productos</h3>
<input id="nombreProd" placeholder="Nombre">
<input id="precioProd" type="number" placeholder="Precio">
<input id="stockProd" type="number" placeholder="Stock">
<button onclick="crearProducto()">Agregar</button>
<div id="adminProductos"></div>
</div>

<!-- USUARIOS -->
<div id="usuarios" class="seccion card">
<h3>👑 Usuarios</h3>
<input id="nuevoUser" placeholder="Usuario">
<input id="nuevoPass" placeholder="Contraseña">
<select id="nuevoRol">
<option value="barbero">Barbero</option>
<option value="admin">Admin</option>
</select>
<button onclick="crearUsuario()">Crear</button>
<div id="listaUsuarios"></div>
</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

const firebaseConfig={apiKey:"AIzaSy...",authDomain:"barberia-pro-3ca72.firebaseapp.com",projectId:"barberia-pro-3ca72"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={},carrito={},total=0,serviciosSel=[];

/* SESIÓN */
window.onload=()=>{
let u=localStorage.getItem("usuario");
if(u) iniciarApp(JSON.parse(u));
else pantallaLogin.classList.remove("hidden");
};

/* LOGIN */
async function login(){
let snap=await db.collection("usuarios").where("usuario","==",user.value).where("password","==",pass.value).get();
if(snap.empty)return alert("Error");
let usuario=snap.docs[0].data();
localStorage.setItem("usuario",JSON.stringify(usuario));
iniciarApp(usuario);
}

/* INICIAR */
function iniciarApp(usuario){
usuarioActivo=usuario;
pantallaLogin.style.display="none";
app.classList.remove("hidden");

if(usuario.rol!=="admin"){
document.querySelectorAll(".admin").forEach(e=>e.style.display="none");
}

cargarTodo();
}

/* CRUD */
async function crearServicio(){
if(!nombreServicio.value||!precioServicio.value)return;
await db.collection("servicios").add({nombre:nombreServicio.value,precio:Number(precioServicio.value)});
nombreServicio.value="";precioServicio.value="";
}

async function crearProducto(){
if(!nombreProd.value||!precioProd.value||!stockProd.value)return;
await db.collection("productos").add({nombre:nombreProd.value,precio:Number(precioProd.value),stock:Number(stockProd.value)});
nombreProd.value="";precioProd.value="";stockProd.value="";
}

async function crearUsuario(){
if(!nuevoUser.value||!nuevoPass.value)return;
await db.collection("usuarios").add({usuario:nuevoUser.value,password:nuevoPass.value,rol:nuevoRol.value});
nuevoUser.value="";nuevoPass.value="";
}

/* EDITAR */
async function editarServicio(id,n,p){
let nn=prompt("Nombre",n);
let np=prompt("Precio",p);
if(!nn||!np)return;
await db.collection("servicios").doc(id).update({nombre:nn,precio:Number(np)});
}

async function eliminarServicio(id){
if(confirm("Eliminar?"))await db.collection("servicios").doc(id).delete();
}

async function editarProducto(id,n,p,s){
let nn=prompt("Nombre",n);
let np=prompt("Precio",p);
let ns=prompt("Stock",s);
if(!nn||!np||!ns)return;
await db.collection("productos").doc(id).update({nombre:nn,precio:Number(np),stock:Number(ns)});
}

async function eliminarProducto(id){
if(confirm("Eliminar?"))await db.collection("productos").doc(id).delete();
}

async function editarUsuario(id,u,p,r){
let nu=prompt("Usuario",u);
let np=prompt("Password",p);
let nr=prompt("Rol",r);
if(!nu||!np||!nr)return;
await db.collection("usuarios").doc(id).update({usuario:nu,password:np,rol:nr});
}

async function eliminarUsuario(id){
if(confirm("Eliminar usuario?"))await db.collection("usuarios").doc(id).delete();
}

/* CARGAR */
function cargarTodo(){

db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
adminServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
let activo=serviciosSel.includes(s.nombre);

listaServicios.innerHTML+=`<div class="servicio ${activo?'activo':''}" onclick="toggleServicio('${s.nombre}',${s.precio})">${s.nombre}<br>$${s.precio}</div>`;

adminServicios.innerHTML+=`<div class="producto">${s.nombre} $${s.precio}<div class="controls"><button onclick="editarServicio('${doc.id}','${s.nombre}',${s.precio})">✏️</button><button onclick="eliminarServicio('${doc.id}')">🗑</button></div></div>`;
});
});

db.collection("productos").onSnapshot(snap=>{
listaProductos.innerHTML="";
adminProductos.innerHTML="";
snap.forEach(doc=>{
let p=doc.data();
let c=carrito[doc.id]?.cantidad||0;

listaProductos.innerHTML+=`<div class="producto">${p.nombre} - $${p.precio} (Stock:${p.stock})<div class="controls"><button onclick="cambiar('${doc.id}',-1,${p.precio},${p.stock})">-</button><span>${c}</span><button onclick="cambiar('${doc.id}',1,${p.precio},${p.stock})">+</button></div></div>`;

adminProductos.innerHTML+=`<div class="producto">${p.nombre} $${p.precio}<div class="controls"><button onclick="editarProducto('${doc.id}','${p.nombre}',${p.precio},${p.stock})">✏️</button><button onclick="eliminarProducto('${doc.id}')">🗑</button></div></div>`;
});
});

db.collection("usuarios").onSnapshot(snap=>{
listaUsuarios.innerHTML="";
snap.forEach(doc=>{
let u=doc.data();
listaUsuarios.innerHTML+=`<div class="producto">${u.usuario} - ${u.rol}<div class="controls"><button onclick="editarUsuario('${doc.id}','${u.usuario}','${u.password}','${u.rol}')">✏️</button><button onclick="eliminarUsuario('${doc.id}')">🗑</button></div></div>`;
});
});

}

/* LÓGICA */
function toggleServicio(n,p){
if(serviciosSel.includes(n)){serviciosSel=serviciosSel.filter(s=>s!==n);total-=p;}
else{serviciosSel.push(n);total+=p;}
monto.value=total;
cargarTodo();
}

function cambiar(id,d,p,s){
if(!carrito[id])carrito[id]={cantidad:0,precio:p};
let n=carrito[id].cantidad+d;
if(n<0)n=0;
if(n>s)return alert("Sin stock");
total+=(n-carrito[id].cantidad)*p;
carrito[id].cantidad=n;
monto.value=total;
cargarTodo();
}

async function guardar(){
for(let id in carrito){
await db.collection("productos").doc(id).update({stock:firebase.firestore.FieldValue.increment(-carrito[id].cantidad)});
}
await db.collection("ventas").add({cliente:cliente.value,total});
alert("Guardado");
}

/* UI */
function mostrarSeccion(id,el){
if(usuarioActivo.rol!=="admin"&&id!=="ventas")return;
document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
document.querySelectorAll(".menu-item").forEach(m=>m.classList.remove("active"));
el.classList.add("active");
}

function logout(){
localStorage.removeItem("usuario");
location.reload();
}

</script>

</body>
</html>
