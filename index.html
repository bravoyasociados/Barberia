<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* 🎨 BASE */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f0f0f,#1c1c1c);
  color:#fff;
}

.container{padding:15px}
.hidden{display:none}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-bottom:15px;
}

.logo-mini{
  position:absolute;
  left:0;
}

.logo-mini img{
  width:50px;
  height:50px;
  border-radius:50%;
}

.titulo{
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;
}

/* MENU */
.menu{
  display:flex;
  justify-content:space-around;
  margin-bottom:20px;
}

.icono{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#1f1f1f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 0 15px rgba(0,200,83,0.3);
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

/* INPUTS */
input,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#2a2a2a;
  color:#fff;
}

input::placeholder{color:#aaa}

/* BOTÓN */
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:#000;
  box-shadow:0 4px 15px rgba(0,200,83,0.4);
}

/* SERVICIOS */
.servicios-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.servicio{
  border-radius:12px;
  padding:10px;
  background:#1f1f1f;
  border:1px solid #333;
  text-align:center;
  font-size:12px;
  transition:0.2s;
}

.servicio.activo{
  background:#00c853;
  color:#000;
  transform:scale(1.05);
}

/* PRODUCTOS */
.producto{
  background:#1f1f1f;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  border:1px solid #333;
}

.controls{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

.controls button{
  width:40px;
  border-radius:8px;
}

/* LOGOUT */
.logout-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff1744,#ff5252);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  box-shadow:0 0 20px rgba(255,0,0,0.6);
}

/* SECCIONES */
.seccion{display:none}
.seccion.activa{display:block}

</style>
</head>

<body>

<div id="pantallaLogin" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container hidden">

<div class="header">
<div class="logo-mini"><img src="icono-192.png"></div>
<div class="titulo">King’s Barber</div>
</div>

<div class="menu">
<div onclick="mostrarSeccion('ventas')"><div class="icono">💰</div></div>
<div class="admin" onclick="mostrarSeccion('servicios')"><div class="icono">✂️</div></div>
<div class="admin" onclick="mostrarSeccion('productos')"><div class="icono">📦</div></div>
<div class="admin" onclick="mostrarSeccion('usuarios')"><div class="icono">👑</div></div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion card">
<input id="cliente" placeholder="Nombre del cliente">

<h4>Servicios</h4>
<div id="listaServicios" class="servicios-grid"></div>

<h4>Productos</h4>
<div id="listaProductos"></div>

<select id="metodoPago">
<option value="">Selecciona método de pago</option>
<option value="efectivo">Efectivo</option>
<option value="tarjeta">Tarjeta</option>
<option value="transferencia">Transferencia</option>
</select>

<input id="monto" placeholder="Total a pagar">
<button onclick="guardar()">Guardar Venta</button>
</div>

</div>

<div class="logout-btn" onclick="logout()">🚪</div>

<script>

const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"barberia-pro-3ca72.firebaseapp.com",
projectId:"barberia-pro-3ca72"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={};

// LOGIN
async function login(){
let snap=await db.collection("usuarios")
.where("usuario","==",user.value)
.where("password","==",pass.value)
.get();

if(snap.empty){alert("Error");return;}

usuarioActivo=snap.docs[0].data();

pantallaLogin.style.display="none";
app.classList.remove("hidden");

if(usuarioActivo.rol!=="admin"){
document.querySelectorAll(".admin").forEach(el=>el.style.display="none");
}

mostrarSeccion("ventas");
cargarDatos();
}

// CARGAR
function cargarDatos(){

db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
listaServicios.innerHTML+=`<div class="servicio">${s.nombre}<br>$${s.precio}</div>`;
});
});

db.collection("productos").onSnapshot(snap=>{
listaProductos.innerHTML="";
snap.forEach(doc=>{
let p=doc.data();
listaProductos.innerHTML+=`<div class="producto">${p.nombre} - $${p.precio}</div>`;
});
});

}

// GUARDAR
async function guardar(){
await db.collection("ventas").add({
cliente:cliente.value,
metodoPago:metodoPago.value,
total:monto.value
});
alert("Venta guardada");
}

// UI
function mostrarSeccion(id){
document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
}

function logout(){
location.reload();
}

</script>

</body>
</html>
