<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King’s Barber</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:#111;color:#fff}
.container{padding:15px}
.hidden{display:none}
.menu{display:flex;justify-content:space-around;margin:10px 0}
.menu-item{cursor:pointer;text-align:center}
.menu-item.active{color:#00e676}
.seccion{display:none}
.seccion.activa{display:block}
.card{background:#1f1f1f;padding:10px;border-radius:10px;margin-top:10px}
.servicio{padding:10px;border:1px solid #444;margin:5px;border-radius:10px}
.servicio.activo{background:#00c853;color:#000}
.producto{margin:5px;padding:10px;background:#222;border-radius:10px}
</style>
</head>

<body>

<div id="pantallaLogin">
<input id="user" placeholder="usuario">
<input id="pass" placeholder="password">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="hidden">

<div class="menu">
<div class="menu-item active" onclick="mostrarSeccion('ventas',this)">Ventas</div>
<div class="menu-item admin" onclick="mostrarSeccion('servicios',this)">Servicios</div>
<div class="menu-item admin" onclick="mostrarSeccion('productos',this)">Productos</div>
<div class="menu-item admin" onclick="mostrarSeccion('usuarios',this)">Usuarios</div>
<div class="menu-item admin" onclick="mostrarSeccion('reportes',this)">Reportes</div>
</div>

<!-- VENTAS -->
<div id="ventas" class="seccion activa">

<div id="listaServicios"></div>
<div id="listaProductos"></div>

<button onclick="guardar()">Guardar Venta</button>

</div>

<!-- SERVICIOS -->
<div id="servicios" class="seccion">
<input id="nombreServicio">
<input id="precioServicio">
<button onclick="crearServicio()">Agregar</button>
<div id="adminServicios"></div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion">
<input id="nombreProd">
<input id="precioProd">
<input id="stockProd">
<button onclick="crearProducto()">Agregar</button>
<div id="adminProductos"></div>
</div>

<!-- USUARIOS -->
<div id="usuarios" class="seccion">
<input id="nuevoUser">
<input id="nuevoPass">
<select id="nuevoRol">
<option value="admin">admin</option>
<option value="barbero">barbero</option>
</select>
<input id="comisionInput">
<button onclick="crearUsuario()">Crear</button>
<div id="listaUsuarios"></div>
</div>

<!-- REPORTES -->
<div id="reportes" class="seccion">
<button onclick="generarReporte()">Reporte</button>
<div id="tabla"></div>
</div>

</div>

<script>

const firebaseConfig={apiKey:"AIza...",authDomain:"...",projectId:"..."};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let usuarioActivo={},serviciosSel=[],carrito={},total=0;

/* LOGIN */
async function login(){
let snap=await db.collection("usuarios")
.where("usuario","==",user.value)
.where("password","==",pass.value).get();

if(snap.empty)return alert("error");

usuarioActivo=snap.docs[0].data();

pantallaLogin.style.display="none";
app.classList.remove("hidden");

cargar();
}

/* NAV */
function mostrarSeccion(id,el){
document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activa"));
document.getElementById(id).classList.add("activa");
}

/* CARGA */
function cargar(){

db.collection("servicios").onSnapshot(snap=>{
listaServicios.innerHTML="";
snap.forEach(doc=>{
let s=doc.data();
listaServicios.innerHTML+=`
<div class="servicio ${serviciosSel.includes(s.nombre)?'activo':''}"
onclick="toggleServicio('${s.nombre}',${s.precio})">
${s.nombre}
</div>`;
});
});

}

/* FUNCIONES */
function toggleServicio(n,p){
if(serviciosSel.includes(n)){
serviciosSel=serviciosSel.filter(x=>x!==n);
}else{
serviciosSel.push(n);
}
cargar();
}

async function guardar(){
await db.collection("ventas").add({
servicios:serviciosSel,
barbero:usuarioActivo.usuario,
total:0,
fecha:new Date()
});
alert("guardado");
}

async function crearServicio(){
await db.collection("servicios").add({
nombre:nombreServicio.value,
precio:Number(precioServicio.value)
});
}

async function crearProducto(){
await db.collection("productos").add({
nombre:nombreProd.value,
precio:Number(precioProd.value),
stock:Number(stockProd.value)
});
}

async function crearUsuario(){
await db.collection("usuarios").add({
usuario:nuevoUser.value,
password:nuevoPass.value,
rol:nuevoRol.value,
comision:Number(comisionInput.value)
});
}

async function generarReporte(){
let snap=await db.collection("ventas").get();
tabla.innerHTML="";
snap.forEach(doc=>{
let v=doc.data();
tabla.innerHTML+=v.barbero+"<br>";
});
}

</script>

</body>
</html>
